{% extends "profile/base.html" %}
{% block title %} Video Gallery {% endblock title %}

{% block content %}
<section class="min-h-screen">
    <div class="mt-20 flex items-center justify-center px-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-12 items-center max-w-6xl w-full">

            <!-- Left Content -->
            <div>
                <h1 class="text-4xl font-bold text-gray-900 mb-4">{{ service.title }}</h1>
                <p class="text-lg text-gray-700 mb-6">
                    {{ service.description | safe }}
                </p>
            </div>

            <!-- Right Image -->
            <div class="flex justify-center">
                <img src="{{ service.icon.url }}" alt="{{ service.title }} icon" class="w-72 h-72">
            </div>
        </div>
        <!-- Call to Action -->
    </div>
    <div class="my-6 bg-blue-50 rounded-xl p-8 text-center">
        <h3 class="text-2xl font-bold mb-4">Interested in this service?</h3>
        <a href="{% url 'home' %}#contact"
            class="inline-block px-8 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
            Contact Us
        </a>
    </div>
</section>
{% endblock content %}
